# App
appTitle=Antifraude em pedidos (POC Jev)
appDescription=Pedidos de compra com indicadores de fraude e avaliacao Jev em modo sombra

# Acoes
acaoAvaliar=Avaliar com Jev (modo sombra)
acaoAvaliarSelecionados=Avaliar selecionados com Jev (modo sombra)

# Secao custom na Object Page
secaoJev=Jev (modo sombra)
msgModoSombra=Modo sombra: a avaliacao do Jev e apenas registrada para analise. Nenhum pedido e bloqueado ou liberado por ela. Se o Jev nao responder em ate 1,5 s, a avaliacao e gravada como INDISPONIVEL.
msgModoSombraLista=Modo sombra: as avaliacoes do Jev sao apenas registradas. Nenhum pedido e bloqueado.
ultimaChamada=Ultima chamada nesta sessao
status=Status
acaoSugerida=Sugestao do modelo (nao decide; a classificacao e do ABAP)
motivo=Motivo
latencia=Latencia
limite=limite
payloadEnviado=State e perguntas enviados ao Jev (sem identificadores)
modelo=Modelo
custo=Custo da chamada (usage.cost)

# Mensagens
msgAvaliado=Avaliacao registrada (modo sombra). Sugestao do modelo (nao decide): {0}
msgIndisponivel=Avaliacao indisponivel ({0}). Registrada como INDISPONIVEL; nada foi bloqueado.
msgBloqueioRegra=Pedido {0}: fornecedor bloqueado (BLOQUEIO_REGRA). O Jev nao foi chamado; a ocorrencia foi registrada no historico.
msgErroAcao=Nao foi possivel gravar a avaliacao no S/4: {0}
msgLoteGrande=Selecione no maximo {0} pedidos por vez.
msgResumoLote=Avaliados: {0} | Indisponivel: {1} | Bloqueio por regra: {2} | Erro ao gravar: {3}
