# App
appTitle=Antifraude em pedidos (POC Jev)
appDescription=Pedidos de compra com indicadores de fraude e avaliação Jev em modo sombra

# Ações
acaoAvaliar=Avaliar com Jev (modo sombra)
acaoAvaliarSelecionados=Avaliar selecionados com Jev (modo sombra)

# Seção "Jev (modo sombra)" na Object Page
secaoJev=Jev (modo sombra)
msgModoSombra=Modo sombra: isto é só um registro para análise. Nenhum pedido foi bloqueado ou liberado.
msgModoSombraLista=Modo sombra: as avaliações do Jev são apenas registradas. Nenhum pedido é bloqueado.

# Estado vazio / carga
vazioTitulo=Este pedido ainda não foi avaliado
vazioDescricao=Use o botão Avaliar com Jev no topo da página.
erroCarga=Não foi possível carregar a última avaliação deste pedido. O histórico continua na tabela Avaliações.

# Veredito (pela classificação gravada no S/4)
vereditoLibera=Pode seguir
vereditoAprovacao=Recomendado revisar antes de aprovar
vereditoBloqueia=Alto risco: este pedido seria bloqueado
vereditoBloqueioRegra=Fornecedor bloqueado no cadastro
vereditoIndisponivel=Não foi possível avaliar agora
etiquetaLibera=Baixo risco
etiquetaAprovacao=Atenção
etiquetaBloqueia=Alto risco
etiquetaBloqueioRegra=Bloqueio de cadastro
etiquetaIndisponivel=Sem avaliação

# Motivos de "não foi possível avaliar"
motivoTimeout=O serviço de análise demorou demais para responder. Tente de novo em alguns instantes.
motivoRede=Não houve conexão com o serviço de análise. Verifique a rede e tente de novo.
motivoSemCreditos=O serviço de análise está sem créditos. Avise a equipe responsável.
motivoAcesso=O acesso ao serviço de análise foi recusado. Avise a equipe responsável.
motivoLimite=Muitas avaliações ao mesmo tempo. Aguarde um pouco e tente de novo.
motivoServicoFora=O serviço de análise está fora do ar no momento. Tente mais tarde.
motivoPedidoRecusado=O serviço de análise não aceitou os dados deste pedido. Avise a equipe responsável.
motivoRespostaInvalida=A resposta do serviço de análise veio incompleta e foi descartada por segurança.
motivoDesconhecido=O serviço de análise não respondeu como esperado.

# Por quê
porQuePrincipal=Principal suspeita: {0} ({1}%).
porQueLibera=Nenhum risco relevante. O maior foi {0} ({1}%).

# Riscos
riscosTitulo=Riscos avaliados
riscoFornecedorFicticio=Fornecedor de fachada
riscoDesvioPagamento=Desvio de pagamento
riscoSobrepreco=Preço acima do normal
riscoFracionamento=Compra dividida em vários pedidos
riscoFraudeInterna=Mesma pessoa em várias etapas da compra
legendaRiscos=Abaixo de {0}%: sem preocupação · {0}% a {1}%: revisar · acima de {1}%: alto risco

# Sinais encontrados no pedido
sinaisTitulo=Sinais encontrados neste pedido
sinaisNenhum=Nenhum sinal de alerta nos indicadores deste pedido.
sinalFornecedorNovo=Fornecedor cadastrado há apenas {0} dias.
sinalFornecedorNovo0=Fornecedor cadastrado no mesmo dia do pedido.
sinalFornecedorNovo1=Fornecedor cadastrado há apenas {0} dia.
sinalMesmaPessoaFornecedor=A mesma pessoa cadastrou o fornecedor e criou o pedido.
sinalContaCompartilhada=A conta bancária do fornecedor também é usada por {0} outros fornecedores.
sinalContaCompartilhada1=A conta bancária do fornecedor também é usada por outro fornecedor.
sinalContaCompartilhadaSemN=A conta bancária do fornecedor também é usada por outros fornecedores.
sinalAlteracoesCadastro={0} alterações de banco ou endereço do fornecedor nos últimos 30 dias.
sinalAlteracoesCadastro1=1 alteração de banco ou endereço do fornecedor nos últimos 30 dias.
sinalPrecoRegistroInfo=Preço {0}% acima do registro info.
sinalPrecoMediaMaterial=Preço {0}% acima da média histórica do material.
sinalPedidos24h={0} outros pedidos ao mesmo fornecedor nas últimas 24 horas ({1} em 7 dias).
sinalPedidos24h1=Outro pedido ao mesmo fornecedor nas últimas 24 horas ({1} em 7 dias).
sinalPedidos7d={0} outros pedidos ao mesmo fornecedor nos últimos 7 dias.
sinalPedidos7d1=Outro pedido ao mesmo fornecedor nos últimos 7 dias.
sinalMaterialNovo=Material nunca comprado deste fornecedor.
sinalCondicaoPagamento=Condição de pagamento diferente do padrão do fornecedor.
sinalFaturaAntes=O pedido foi criado depois da fatura.
sinalCriadorEntrada=Quem criou o pedido também lançou a entrada de mercadoria.
sinalValorMedia=Valor {0} vezes a média dos pedidos anteriores a este fornecedor.

# Rodapé
rodapeAvaliado=Avaliado em {0} por {1}
rodapeAtipicidade=Atipicidade {0} de 5
rodapeSugestao=Sugestão do modelo: {0} ({1}%), informativo; quem decide é a regra do ABAP
sugestaoLiberar=Liberar
sugestaoAprovacao=Aprovação
sugestaoBloquear=Bloquear

# Detalhes técnicos
detalhesTecnicos=Detalhes técnicos
detalhesSemChamada=Nenhuma chamada ao Jev nesta sessão.
detalhesHistorico=O histórico completo de avaliações está na tabela Avaliações (Jev).
ultimaChamada=Última chamada nesta sessão
status=Status técnico
motivo=Motivo técnico
latencia=Latência
limite=limite
modelo=Modelo
custo=Custo da chamada (usage.cost)

# Mensagens
msgAvaliado=Avaliação registrada (modo sombra).
msgIndisponivel=Não foi possível avaliar agora. A tentativa foi registrada e nada foi bloqueado.
msgBloqueioRegra=Pedido {0}: o fornecedor está bloqueado no cadastro. O Jev não foi consultado; a ocorrência foi registrada no histórico.
msgErroAcao=Não foi possível gravar a avaliação no S/4: {0}
msgLoteGrande=Selecione no máximo {0} pedidos por vez.
msgResumoLote=Avaliados: {0} | Não foi possível avaliar: {1} | Fornecedor bloqueado no cadastro: {2} | Erro ao gravar: {3}
